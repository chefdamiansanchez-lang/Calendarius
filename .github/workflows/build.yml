name: Compilar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir el proyecto (zip)
        run: |
          ZIP=$(ls *.zip | head -n 1)
          echo "Usando: $ZIP"
          mkdir proyecto
          unzip -q "$ZIP" -d proyecto
          DIR=$(dirname "$(find proyecto -name settings.gradle.kts | head -n 1)")
          echo "DIR=$DIR" >> $GITHUB_ENV

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle -p "$DIR" assembleDebug --no-daemon

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: calendario-datco-apk
          path: ${{ env.DIR }}/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: calendario-v${{ github.run_number }}
          name: Calendario DATCO v${{ github.run_number }}
          files: ${{ env.DIR }}/app/build/outputs/apk/debug/app-debug.apk
